name: CI

# Regression gate: every push and pull request to `main` must build cleanly,
# pass formatting and clippy, and pass the full unit + integration suite.
# The `e2e` tests need a physical iPhone, so they are compile-checked here
# but never executed.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel an in-progress run when the same branch/PR is pushed again.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# Least-privilege default for every job in this workflow. Individual jobs
# can elevate if they need to (none do today).
permissions:
  contents: read

jobs:
  test:
    # quokka is a macOS tool (it talks to usbmuxd); CI runs on macOS to match.
    # Release ships both x86_64 and aarch64 darwin, so test both. GitHub
    # retired the `macos-13` image (the last x86_64 macOS runner), so both
    # architectures run on the arm64 image: aarch64 natively, x86_64 built
    # with `--target` and executed through Rosetta 2, which the arm64 runner
    # images ship preinstalled.
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7

      # rust-toolchain.toml pins the channel; this action honors it and
      # installs the rustfmt + clippy components it lists.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.target }}

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (warnings denied)
        run: cargo clippy --all-targets --target ${{ matrix.target }} -- -D warnings

      - name: Run unit + integration tests
        run: cargo test --all-targets --target ${{ matrix.target }}

      - name: Doc tests
        run: cargo test --doc --target ${{ matrix.target }}

      # The `e2e` tests cannot run without an iPhone, but a broken e2e test
      # file should still fail CI — so compile-check it without running.
      - name: Compile-check e2e tests
        run: cargo test --features e2e --no-run --target ${{ matrix.target }}

  # Cross-platform compile gate (issue #13): quokka is macOS-first, but
  # `cargo install --git` from source must keep working on Windows and Linux,
  # and quokka-core is a dependency of the Windows GUI. Native runners compile
  # the whole graph — a macOS cross-check can't, because `aws-lc-sys` needs the
  # target platform's C toolchain and headers. Clippy with warnings denied
  # compile-checks every target (tests included) without running anything.
  cross-check:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # aws-lc-sys assembles its crypto primitives with NASM on Windows; the
      # runner image doesn't ship it.
      - name: Install NASM (aws-lc-sys build dep on Windows)
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Clippy (warnings denied)
        run: cargo clippy --all-targets -- -D warnings

  # Supply-chain hygiene: cargo-audit catches CVEs in transitive deps,
  # cargo-deny enforces license + duplicate-version policy from `deny.toml`.
  # Runs in parallel with the test job so it doesn't slow regression feedback.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo audit
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: cargo deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check bans licenses sources

  # Coverage ratchet (QA strategy, layer-0 gate): new code must come with
  # tests. On a pull request, head line coverage may not drop below the base
  # branch — a no-regression "ratchet", not an arbitrary fixed floor, so the
  # legacy tree never needs a one-shot backfill. Self-contained (no external
  # coverage SaaS) to keep the supply chain as tight as the audit job does.
  # Runs on macOS to match the test job (the suite talks to usbmuxd/adb shims).
  coverage:
    if: github.event_name == 'pull_request'
    runs-on: macos-14
    # llvm-cov injects its own instrumentation RUSTFLAGS; clear the workflow's
    # `-D warnings` here so the two don't fight (llvm-cov warns when RUSTFLAGS
    # is already set).
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # need the base commit for the ratchet comparison
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov

      - name: Measure head coverage
        id: head
        run: |
          pct=$(cargo llvm-cov --all-targets --summary-only --json \
            | jq '.data[0].totals.lines.percent')
          echo "pct=$pct" >> "$GITHUB_OUTPUT"
          echo "Head line coverage: ${pct}%"

      - name: Measure base coverage
        id: base
        run: |
          git checkout --quiet ${{ github.event.pull_request.base.sha }}
          pct=$(cargo llvm-cov --all-targets --summary-only --json \
            | jq '.data[0].totals.lines.percent')
          echo "pct=$pct" >> "$GITHUB_OUTPUT"
          echo "Base line coverage: ${pct}%"

      - name: Enforce ratchet
        run: |
          awk -v h='${{ steps.head.outputs.pct }}' -v b='${{ steps.base.outputs.pct }}' 'BEGIN {
            if (h + 0.1 < b) {
              printf("FAIL: coverage regressed — head %.2f%% < base %.2f%%\n", h, b)
              exit 1
            }
            printf("OK: head %.2f%% >= base %.2f%% (0.1%% tolerance)\n", h, b)
          }'

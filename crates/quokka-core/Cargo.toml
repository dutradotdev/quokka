[package]
name = "quokka-core"
version = "0.3.1"
edition = "2021"
description = "Presentation-free core for quokka: the Device seam, the application facade, and the pure projection/format logic shared by the CLI and the GUI."
license = "MIT"
repository = "https://github.com/dutradotdev/quokka"
homepage = "https://github.com/dutradotdev/quokka"
readme = "../../README.md"
keywords = ["ios", "iphone", "idevice", "usbmuxd", "adb"]
categories = ["command-line-utilities"]
# Distribution is via the `quokka-cli` binaries (Homebrew / curl installer);
# nothing here is a library people should depend on via `cargo install`.
publish = false

[lib]
name = "quokka_core"
path = "src/lib.rs"

[features]
default = []
# Gates the real-device-only helpers (e.g. `device::bench`). The CLI's `e2e`
# feature forwards to this; the device code only compiles them with a real
# iPhone in the loop. Never run in CI (compile-checked only).
e2e = []
# Symmetric gate for real-Android-only helpers, forwarded from the CLI.
e2e-android = []

[dependencies]
# Pinned with `=` — the idevice crate warns of breaking changes at every point
# release until 0.2.0. Re-run Prompt 0's research before bumping. The
# `tools/src/` directory of the upstream repo is the canonical usage example.
idevice = { version = "=0.1.61", default-features = false, features = [
    # Crypto backend for lockdown TLS. `aws-lc` is upstream's default; it
    # implies `rustls`. The other option would be `ring`.
    "aws-lc",
    "usbmuxd",
    "diagnostics_relay",
    "afc",
    "installation_proxy",
    "syslog_relay",
    "pcapd",
    "rsd",
] }

# Android transport: talks the adb protocol to a local adb server on
# 127.0.0.1:5037. Pinned with `=` for the same reason as `idevice` — a
# fast-moving pre-1.0 surface we want to absorb deliberately. Chosen over
# `adb_client` because it has no `rsa` dependency: server mode lets the adb
# daemon do the device auth, so pulling in `rsa` (RUSTSEC-2023-0071, the
# unpatched "Marvin Attack" timing sidechannel) was dead weight that still
# flagged every downstream supply-chain scan. forensic-adb's tree is crypto-free.
forensic-adb = "=0.8.1"

tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "process"] }
anyhow = "1"
thiserror = "2"
async-trait = "0.1"
# Serializable DTOs — the contract the CLI's `--json` and the GUI consume.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `FuturesUnordered` for bounded-concurrency batched lookups.
futures = "0.3"
# Used directly to type plist values returned from `idevice` (which depends
# on the same major version transitively).
plist = "1"

# SVG → PNG pipeline for the share card. `usvg` parses, `resvg` rasterises onto
# a `tiny-skia` pixmap. `fontdb` is held by `usvg::Options` so we can register
# the embedded JetBrains Mono bytes before parsing (`resvg` doesn't consult
# system fonts on macOS reliably).
resvg = "0.47"
usvg = "0.47"
tiny-skia = "0.12"
# URL-encoding for the Twitter intent URL. The std-only alternative would
# hand-roll percent-encoding; `urlencoding` is 30 lines and avoids the
# usual escape-set off-by-ones.
urlencoding = "2"
# Encoding the embedded mascot PNG as a data-URI for the card's `<image>`
# element. usvg/resvg parses `data:image/png;base64,…` natively; this lets
# us ship a single self-contained SVG with no external file references.
base64 = "0.22"

# Decode + downscale + re-encode embedded media thumbnails (the `thumbnail`
# facade). Pure-Rust codecs only (`jpeg`, `png`) — no `libheif`/native build
# step — so the core cross-compiles cleanly to both macOS and Windows, which
# the GUI targets. The HEIF/HEVC decoder (Phase B2) is deliberately *not*
# pulled in: B1 only re-encodes embedded thumbnails that are already JPEG/PNG.
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "test-util"] }
# Property testing for the tolerant Android parsers (dumpsys / diskstats). The
# invariant under test is "arbitrary input never panics" — the executable form
# of the project's tolerant-parsing-not-per-OEM-branching rule.
proptest = "1"
